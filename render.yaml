services:
  - type: web
    name: notesmaker-batch-worker
    runtime: node
    plan: free
    # Deliberately a free Web Service, not a Background Worker — Render has
    # no free tier for Background Worker services. A free Web Service just
    # sleeps after 15 minutes with no HTTP traffic; see worker/README.md for
    # the free external ping that keeps this one awake around the clock.
    buildCommand: npm install && npm install --prefix worker
    startCommand: npm --prefix worker start
    healthCheckPath: /
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WORKER_SHARED_SECRET
        sync: false
      # Optional — turns this server into the app's long-running AI proxy
      # (see worker/src/aiProxy.ts). The whole service-account .json as one
      # value; leave unset and the app keeps using the Supabase function.
      - key: GCP_SA_KEY
        sync: false
      # Optional — same comma-separated allow-list as the Supabase function.
      - key: ALLOWED_ORIGINS
        sync: false
